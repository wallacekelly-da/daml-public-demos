services:

  canton:
    container_name: canton
    image: digitalasset-docker.jfrog.io/canton-enterprise:3.3.0-snapshot.20250425.15794.0.v8777d491
    volumes:
      - ./configs:/canton/host/configs
    command: >
      daemon
      --config "/canton/host/configs/canton.conf"
      --bootstrap "/canton/host/configs/bootstrap.canton"
      --log-profile container
    expose:
      - 5001
      - 5002
      - 5007
      - 5008
      - 5009
    ports:
      - 5001:5001
      - 5002:5002

  console:
    container_name: console
    image: digitalasset-docker.jfrog.io/canton-enterprise:3.3.0-snapshot.20250425.15794.0.v8777d491
    volumes:
      - ./configs:/canton/host/configs
    command: >
      --no-tty
      --config "/canton/host/configs/console.conf"
      --log-profile container
      --log-level-root WARN
